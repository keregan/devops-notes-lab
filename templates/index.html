<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Notes Lab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main data-status="redis-connected">
    <span class="status">Redis подключён</span>
    <h1>DevOps Notes Lab</h1>
    <p>Flask-приложение работает в Docker и сохраняет счётчик посещений в Redis.</p>

    <section class="counter" aria-label="Счётчик посещений">
      Страница открыта раз
      <strong>{{ visits }}</strong>
    </section>

    <nav aria-label="Служебные endpoints">
      <a href="/health">/health</a>
      <a href="/ready">/ready</a>
      <a href="/info">/info</a>
      <a href="/metrics">/metrics</a>
    </nav>

    <footer>Версия {{ app_version }} · окружение {{ app_environment }}</footer>
  </main>
</body>
</html>
