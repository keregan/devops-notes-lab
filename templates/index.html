<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Notes Lab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #eef2ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.25), transparent 34rem),
        #0b1020;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(24px, 6vw, 48px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.88);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.12);
      color: #86efac;
      font-weight: 700;
    }

    .status::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      content: "";
      box-shadow: 0 0 14px #22c55e;
    }

    h1 {
      margin: 24px 0 12px;
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1;
    }

    p {
      color: #cbd5e1;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .counter {
      margin: 32px 0;
      padding: 24px;
      border-radius: 18px;
      background: #111a31;
    }

    .counter strong {
      display: block;
      margin-top: 6px;
      color: #60a5fa;
      font-size: clamp(2.5rem, 12vw, 5rem);
      line-height: 1;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    a {
      padding: 10px 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #bfdbfe;
      text-decoration: none;
    }

    a:hover { border-color: #60a5fa; }

    footer {
      margin-top: 24px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main data-status="redis-connected">
    <span class="status">Redis подключён</span>
    <h1>DevOps Notes Lab</h1>
    <p>Flask-приложение работает в Docker и сохраняет счётчик посещений в Redis.</p>

    <section class="counter" aria-label="Счётчик посещений">
      Страница открыта раз
      <strong>{{ visits }}</strong>
    </section>

    <nav aria-label="Служебные endpoints">
      <a href="/health">/health</a>
      <a href="/ready">/ready</a>
      <a href="/info">/info</a>
      <a href="/metrics">/metrics</a>
    </nav>

    <footer>Версия {{ app_version }} · окружение {{ app_environment }}</footer>
  </main>
</body>
</html>
