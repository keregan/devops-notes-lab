stages:
  - test
  - integration

default:
  interruptible: true

unit_tests:
  stage: test
  image: python:3.13.14-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements.txt
  script:
    - python -m unittest discover -s tests -v

docker_compose_test:
  stage: integration
  image: docker:29.6.2-cli
  services:
    - name: docker:29.6.2-dind
      alias: docker
      command: ["--tls=false"]
  needs:
    - unit_tests
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    HEALTHCHECK_TCP_PORT: "2375"
    COMPOSE_PROJECT_NAME: devops-notes-lab-ci
    APP_PORT: "8080"
    APP_VERSION: "1.2.1"
    APP_ENVIRONMENT: ci
  before_script:
    - docker info
    - docker compose version
  script:
    - docker compose config --quiet
    - docker compose build --pull
    - docker compose up -d --wait --wait-timeout 60
    - |
      redis_container_id="$(docker compose ps --quiet redis)"
      test -n "$redis_container_id"

      binding_count="$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$redis_container_id")"
      if [ "$binding_count" -ne 0 ]; then
        echo "Redis must not publish ports to the host"
        docker port "$redis_container_id" || true
        exit 1
      fi

      redis_ping="$(docker compose exec -T redis redis-cli ping)"
      test "$redis_ping" = "PONG"
    - |
      health="$(wget --quiet --output-document=- http://docker:8080/health)"
      readiness="$(wget --quiet --output-document=- http://docker:8080/ready)"
      info="$(wget --quiet --output-document=- http://docker:8080/info)"
      metrics="$(wget --quiet --output-document=- http://docker:8080/metrics)"
      page="$(wget --quiet --output-document=- http://docker:8080/)"

      echo "$health" | grep --quiet '"status":"ok"'
      echo "$readiness" | grep --quiet '"status":"ready"'
      echo "$info" | grep --quiet '"version":"1.2.1"'
      echo "$info" | grep --quiet '"environment":"ci"'
      echo "$metrics" | grep --quiet '^devops_notes_lab_redis_up 1$'
      echo "$page" | grep --quiet 'redis-connected'
  after_script:
    - docker compose ps || true
    - docker compose logs --no-color > compose.log 2>&1 || true
    - docker compose down --volumes --remove-orphans || true
  artifacts:
    when: always
    paths:
      - compose.log
    expire_in: 1 week
