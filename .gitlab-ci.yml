stages:
  - test
  - integration

default:
  interruptible: true

unit_tests:
  stage: test
  image: python:3.13.14-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  script:
    - python -m pip_audit --strict --progress-spinner off -r requirements.txt
    - python -m ruff check .
    - python -m coverage run -m unittest discover -s tests -v
    - python -m coverage report

docker_compose_test:
  stage: integration
  image: docker:29.6.2-cli
  services:
    - name: docker:29.6.2-dind
      alias: docker
      command: ["--tls=false"]
  needs:
    - unit_tests
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    HEALTHCHECK_TCP_PORT: "2375"
    COMPOSE_PROJECT_NAME: devops-notes-lab-ci
    APP_PORT: "8080"
    APP_VERSION: "1.3.0"
    APP_ENVIRONMENT: ci
    GRAFANA_ADMIN_PASSWORD: ci-only-password
  before_script:
    - docker info
    - docker compose version
  script:
    - docker compose config --quiet
    - docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config --quiet
    - docker compose -f docker-compose.yml -f docker-compose.monitoring.yml build --pull
    - docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --wait --wait-timeout 120
    - |
      redis_container_id="$(docker compose -f docker-compose.yml -f docker-compose.monitoring.yml ps --quiet redis)"
      test -n "$redis_container_id"

      binding_count="$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$redis_container_id")"
      if [ "$binding_count" -ne 0 ]; then
        echo "Redis must not publish ports to the host"
        docker port "$redis_container_id" || true
        exit 1
      fi

      redis_ping="$(docker compose -f docker-compose.yml -f docker-compose.monitoring.yml exec -T redis redis-cli ping)"
      test "$redis_ping" = "PONG"
    - |
      app_get() {
        docker compose -f docker-compose.yml -f docker-compose.monitoring.yml exec -T app \
          python -c 'import sys; from urllib.request import urlopen; print(urlopen(f"http://localhost:8000{sys.argv[1]}").read().decode())' "$1"
      }

      health="$(app_get /health)"
      readiness="$(app_get /ready)"
      info="$(app_get /info)"
      metrics="$(app_get /metrics)"
      page="$(app_get /)"
      styles="$(app_get /static/styles.css)"

      echo "$health" | grep --quiet '"status":"ok"'
      echo "$readiness" | grep --quiet '"status":"ready"'
      echo "$info" | grep --quiet '"version":"1.3.0"'
      echo "$info" | grep --quiet '"environment":"ci"'
      echo "$metrics" | grep --quiet '^devops_notes_lab_redis_up 1$'
      echo "$page" | grep --quiet 'redis-connected'
      echo "$styles" | grep --quiet 'color-scheme: dark'
    - |
      prometheus_get() {
        docker compose -f docker-compose.yml -f docker-compose.monitoring.yml exec -T prometheus \
          wget --quiet --output-document=- "http://localhost:9090$1"
      }

      prometheus_ready="$(prometheus_get /-/ready)"
      grafana_health="$(docker compose -f docker-compose.yml -f docker-compose.monitoring.yml exec -T grafana \
        wget --quiet --output-document=- http://localhost:3000/api/health)"

      echo "$prometheus_ready" | grep --quiet 'Prometheus Server is Ready'
      echo "$grafana_health" | grep --quiet '"database"[[:space:]]*:[[:space:]]*"ok"'

      attempt=1
      while [ "$attempt" -le 12 ]; do
        targets="$(prometheus_get /api/v1/targets)"
        if echo "$targets" | grep --quiet '"job":"devops-notes-lab"' \
          && echo "$targets" | grep --quiet '"health":"up"'; then
          break
        fi
        if [ "$attempt" -eq 12 ]; then
          echo "Prometheus target devops-notes-lab did not become healthy"
          echo "$targets"
          exit 1
        fi
        attempt=$((attempt + 1))
        sleep 5
      done
  after_script:
    - docker compose -f docker-compose.yml -f docker-compose.monitoring.yml ps || true
    - docker compose -f docker-compose.yml -f docker-compose.monitoring.yml logs --no-color > compose.log 2>&1 || true
    - docker compose -f docker-compose.yml -f docker-compose.monitoring.yml down --volumes --remove-orphans || true
  artifacts:
    when: always
    paths:
      - compose.log
    expire_in: 1 week
