name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application and Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PORT: 8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 60

      - name: Check HTTP endpoints
        shell: bash
        run: |
          health="$(curl --fail --silent --show-error http://localhost:8080/health)"
          ready="$(curl --fail --silent --show-error http://localhost:8080/ready)"
          page="$(curl --fail --silent --show-error http://localhost:8080/)"

          echo "$health" | grep --quiet '"status":"ok"'
          echo "$ready" | grep --quiet '"status":"ready"'
          echo "$page" | grep --quiet 'redis-connected'

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
