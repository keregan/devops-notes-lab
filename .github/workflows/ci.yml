name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application and Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PORT: 8080
      APP_VERSION: "1.2.1"
      APP_ENVIRONMENT: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 60

      - name: Verify Redis is internal only
        shell: bash
        run: |
          redis_container_id="$(docker compose ps --quiet redis)"
          test -n "$redis_container_id"

          binding_count="$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$redis_container_id")"
          if [ "$binding_count" -ne 0 ]; then
            echo "Redis must not publish ports to the host"
            docker port "$redis_container_id" || true
            exit 1
          fi

          redis_ping="$(docker compose exec -T redis redis-cli ping)"
          test "$redis_ping" = "PONG"

      - name: Check HTTP endpoints
        shell: bash
        run: |
          health="$(curl --fail --silent --show-error http://localhost:8080/health)"
          ready="$(curl --fail --silent --show-error http://localhost:8080/ready)"
          info="$(curl --fail --silent --show-error http://localhost:8080/info)"
          metrics="$(curl --fail --silent --show-error http://localhost:8080/metrics)"
          page="$(curl --fail --silent --show-error http://localhost:8080/)"

          echo "$health" | grep --quiet '"status":"ok"'
          echo "$ready" | grep --quiet '"status":"ready"'
          echo "$info" | grep --quiet '"version":"1.2.1"'
          echo "$info" | grep --quiet '"environment":"ci"'
          echo "$metrics" | grep --quiet '^devops_notes_lab_redis_up 1$'
          echo "$page" | grep --quiet 'redis-connected'

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
