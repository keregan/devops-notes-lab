name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate tag, version and changelog
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the vX.Y.Z format"
            exit 1
          fi

          project_version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v${project_version}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $project_version"
            exit 1
          fi

          grep --fixed-strings --quiet "## [${project_version}]" CHANGELOG.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "DevOps Notes Lab $GITHUB_REF_NAME"
