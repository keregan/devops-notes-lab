name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Validate tagged commit
    uses: ./.github/workflows/ci.yml

  publish-image:
    name: Publish Docker image to GHCR
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag, version and changelog
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the vX.Y.Z format"
            exit 1
          fi

          project_version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v${project_version}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $project_version"
            exit 1
          fi

          grep --fixed-strings --quiet "## [${project_version}]" CHANGELOG.md
          echo "value=${project_version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Build and push versioned Docker image
        id: image
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          image="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          docker build \
            --build-arg "IMAGE_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${PROJECT_VERSION}" \
            --tag "${image}:${PROJECT_VERSION}" \
            --tag "${image}:latest" \
            .
          docker push "${image}:${PROJECT_VERSION}"
          docker push "${image}:latest"
          docker manifest inspect "${image}:${PROJECT_VERSION}" > /dev/null

          echo "repository=${image}" >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub Release
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "DevOps Notes Lab $GITHUB_REF_NAME"
